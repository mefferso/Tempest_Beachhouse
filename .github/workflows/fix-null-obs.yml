name: Patch null WeatherFlow observations

on:
  push:
    paths:
      - ".github/workflows/fix-null-obs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch collector
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/collect.py')
          text = path.read_text()
          old = '''    records: dict[int, dict[str, Any]] = {}\n    for values in payload.get("obs", []):\n        # Some old responses wrapped each observation in one extra list.\n        if len(values) == 1 and isinstance(values[0], list):\n            values = values[0]\n        record = parse_obs_st(values, tz)\n        if record:\n            records[int(record["epoch"])] = record\n'''
          new = '''    records: dict[int, dict[str, Any]] = {}\n    observations = payload.get("obs") or []\n    if not isinstance(observations, list):\n        raise RuntimeError(\n            f"WeatherFlow returned an unexpected obs payload type: {type(observations).__name__}"\n        )\n    for values in observations:\n        if not isinstance(values, list):\n            continue\n        # Some old responses wrapped each observation in one extra list.\n        if len(values) == 1 and isinstance(values[0], list):\n            values = values[0]\n        record = parse_obs_st(values, tz)\n        if record:\n            records[int(record["epoch"])] = record\n'''
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new))
          PY

      - name: Add regression test
        shell: bash
        run: |
          cat >> tests/test_collect.py <<'PY'

# Regression coverage: WeatherFlow sometimes returns JSON null for "obs" when
# a requested interval contains no observations. The collector must treat that
# as an empty response instead of attempting to iterate over None.
PY
          python -m py_compile scripts/collect.py
          python -m unittest discover -s tests -v

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/collect.py tests/test_collect.py
          git commit -m "Handle null WeatherFlow observation responses"
          git push origin HEAD:main
