name: Patch null WeatherFlow observations

on:
  push:
    paths:
      - ".github/workflows/fix-null-obs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch collector
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("scripts/collect.py"); s=p.read_text(); old="    records: dict[int, dict[str, Any]] = {}\n    for values in payload.get(\"obs\", []):\n"; new="    records: dict[int, dict[str, Any]] = {}\n    observations = payload.get(\"obs\") or []\n    for values in observations:\n"; assert old in s, "target block not found"; p.write_text(s.replace(old,new,1))'
          python -m py_compile scripts/collect.py
          python -m unittest discover -s tests -v

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/collect.py
          git commit -m "Handle null WeatherFlow observation responses"
          git push origin HEAD:main
