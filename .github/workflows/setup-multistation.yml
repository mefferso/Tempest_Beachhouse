name: Set up multi-station climate archive

on:
  push:
    paths:
      - ".github/workflows/setup-multistation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch website and collection workflow
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("docs/index.html"); s=p.read_text(); marker="  <script src=\"app.js\" defer></script>"; replacement="  <script src=\"station-switch.js\"></script>\n  <script src=\"app.js\" defer></script>"; p.write_text(s if "station-switch.js" in s else s.replace(marker,replacement,1))'
          python -c 'from pathlib import Path; p=Path(".github/workflows/collect.yml"); s=p.read_text().replace("python scripts/collect.py","python scripts/collect_all.py").replace("git add data/raw docs/data","git add data docs/data"); p.write_text(s)'
          python -m py_compile scripts/collect.py scripts/collect_all.py
          node --check docs/app.js
          node --check docs/station-switch.js

      - name: Commit setup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html .github/workflows/collect.yml
          git commit -m "Enable Mandeville and beach station switching"
          git push origin HEAD:main
