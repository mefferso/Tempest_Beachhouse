name: Set up multi-station climate archive

on:
  push:
    paths:
      - ".github/workflows/setup-multistation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add station switch script to dashboard
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("docs/index.html"); s=p.read_text(); marker="  <script src=\"app.js\" defer></script>"; replacement="  <script src=\"station-switch.js\"></script>\n  <script src=\"app.js\" defer></script>"; p.write_text(s if "station-switch.js" in s else s.replace(marker,replacement,1))'
          node --check docs/app.js
          node --check docs/station-switch.js

      - name: Commit website setup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "Dashboard already configured."
            exit 0
          fi
          git commit -m "Enable Mandeville and beach station switching"
          git push origin HEAD:main
