name: Bootstrap Tempest climate project

on:
  push:
    paths:
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install project files
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk*.b64 > /tmp/tempest-project.tar.gz.b64
          base64 --decode /tmp/tempest-project.tar.gz.b64 > /tmp/tempest-project.tar.gz
          tar -xzf /tmp/tempest-project.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          # GitHub's workflow token cannot create other workflow files. Those two
          # files are added immediately afterward through the GitHub connection.
          rm -f .github/workflows/collect.yml .github/workflows/pages.yml

      - name: Commit project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Tempest climate archive and website"
          git push origin HEAD:main
